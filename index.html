<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ رفیق هوشمند</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh; display: flex;
    justify-content: center; align-items: center; padding: 15px;
  }
  .container {
    width: 100%; max-width: 900px; height: 94vh;
    background: #fff; border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff; padding: 14px 20px; text-align: center;
  }
  .header h1 { font-size: 20px; margin-bottom: 4px; }
  .header p { font-size: 12px; opacity: 0.9; }
  .chat-box {
    flex: 1; overflow-y: auto; padding: 20px; background: #f7f8fc;
  }
  .message { margin-bottom: 15px; display: flex; flex-direction: column; }
  .message.user { align-items: flex-start; }
  .message.bot { align-items: flex-end; }
  .bubble {
    max-width: 80%; padding: 12px 16px; border-radius: 18px;
    line-height: 1.7; font-size: 14px; word-wrap: break-word;
  }
  .user .bubble {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff; border-bottom-right-radius: 4px;
  }
  .bot .bubble {
    background: #fff; color: #333; border: 1px solid #e0e0e0;
    border-bottom-left-radius: 4px;
  }
  .input-area {
    padding: 14px; background: #fff; border-top: 1px solid #e0e0e0;
    display: flex; gap: 10px;
  }
  .input-area input {
    flex: 1; padding: 13px 18px; border: 2px solid #e0e0e0;
    border-radius: 25px; font-size: 14px; font-family: inherit; outline: none;
  }
  .input-area button {
    padding: 13px 26px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff; border: none; border-radius: 25px;
    font-size: 14px; font-weight: bold; cursor: pointer; font-family: inherit;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>⚡ رفیق هوشمند</h1>
    <p>ساخته‌شده توسط Adrian</p>
  </div>
  <div class="chat-box" id="chatBox">
    <div class="message bot">
      <div class="bubble">سلام داداش! 😊 من یه دموی هوش مصنوعی هستم. هر چی می‌خوای بپرس!</div>
    </div>
  </div>
  <div class="input-area">
    <input type="text" id="userInput" placeholder="چی می‌خوای بگی داداش؟" autocomplete="off">
    <button onclick="sendMessage()">بفرست</button>
  </div>
</div>

<script>
  const chatBox = document.getElementById('chatBox');
  const userInput = document.getElementById('userInput');

  userInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  function addMessage(text, sender) {
    const div = document.createElement('div');
    div.className = 'message ' + sender;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    div.appendChild(bubble);
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  // پاسخ‌های آماده (بدون API)
  const replies = {
    "سلام": "سلام داداش! 😊 چطوری؟",
    "خوبی": "من خوبم داداش! تو چطوری؟ 💪",
    "اسمت چیه": "من رفیق هوشمند تو هستم! 😄",
    "چیکار می‌کنی": "دارم با تو حرف می‌زنم داداش! 🚀",
    "ممنون": "قربونت داداش! 💙",
    "خداحافظ": "خداحافظ داداش! روز خوبی داشته باشی 👋",
  };

  function sendMessage() {
    const msg = userInput.value.trim();
    if (!msg) return;
    addMessage(msg, 'user');
    userInput.value = '';

    setTimeout(() => {
      const lower = msg.toLowerCase();
      let answer = "داداش، من الان یه دموی ساده‌ام. برای هوش مصنوعی واقعی، باید یه سرویس وصل کنیم. 😊";
      for (const key in replies) {
        if (lower.includes(key)) {
          answer = replies[key];
          break;
        }
      }
      addMessage(answer, 'bot');
    }, 500);
  }
</script>
</body>
</html>
