<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛒 بازار Adrian</title>
<style>
  * { box-sizing: border-box; font-family: Tahoma, sans-serif; margin: 0; padding: 0; }
  body {
    background: linear-gradient(135deg,#0a0e1a,#1a1a2e);
    color: #eee;
    min-height: 100vh;
  }
  body::before {
    content: '';
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(2px 2px at 20% 30%, #4a9eff, transparent),
      radial-gradient(2px 2px at 60% 70%, #6bb6ff, transparent),
      radial-gradient(1px 1px at 50% 50%, #4a9eff, transparent);
    background-size: 200% 200%;
    animation: stars 20s linear infinite;
    z-index: 0;
    opacity: 0.5;
    pointer-events: none;
  }
  @keyframes stars { from { background-position: 0 0; } to { background-position: 100% 100%; } }
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(15,20,35,0.95);
    backdrop-filter: blur(15px);
    padding: 15px 20px;
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 10px;
    border-bottom: 1px solid rgba(74,158,255,0.25);
  }
  header h1 {
    font-size: 20px;
    background: linear-gradient(135deg, #4a9eff, #6bb6ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: bold;
  }
  nav { display: flex; flex-wrap: wrap; gap: 5px; }
  nav a {
    color: #c8d6e5; text-decoration: none;
    padding: 8px 14px; border-radius: 8px;
    font-size: 14px; cursor: pointer;
  }
  nav a:hover { background: rgba(74,158,255,0.15); color: #6bb6ff; }
  .container { position: relative; z-index: 1; max-width: 900px; margin: 20px auto; padding: 0 15px; }
  .card {
    background: rgba(25,30,50,0.7);
    backdrop-filter: blur(10px);
    padding: 25px;
    border-radius: 18px;
    border: 1px solid rgba(74,158,255,0.2);
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    margin-bottom: 20px;
  }
  h2 { color: #6bb6ff; margin-bottom: 18px; font-size: 22px; }
  label { display: block; margin: 12px 0 5px; font-size: 14px; color: #a8b8d0; }
  input, textarea, select {
    width: 100%; padding: 12px; border-radius: 10px;
    border: 1px solid rgba(74,158,255,0.25);
    background: rgba(10,15,30,0.7); color: #eee;
    font-size: 14px; outline: none; font-family: inherit;
  }
  input:focus, textarea:focus, select:focus { border-color: #4a9eff; }
  button, .btn {
    display: inline-block; margin-top: 15px; padding: 13px 26px;
    background: linear-gradient(135deg,#1a3a6e,#4a9eff);
    color: #fff; border: none; border-radius: 10px;
    cursor: pointer; font-size: 15px; text-decoration: none;
    font-family: inherit; font-weight: bold;
  }
  button:hover, .btn:hover { transform: translateY(-2px); }
  .btn-small { padding: 8px 16px; font-size: 13px; margin-top: 8px; }
  .flash { padding: 14px; border-radius: 10px; margin-bottom: 15px; font-size: 14px; }
  .flash.error { background: rgba(74,31,31,0.5); color: #ffb3b3; border: 1px solid #d9534f; }
  .flash.success { background: rgba(31,74,42,0.5); color: #b3ffc3; border: 1px solid #4caf50; }
  .flash.info { background: rgba(26,42,58,0.5); color: #a8d0ff; border: 1px solid #4a90e2; }
  .apps-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 20px; margin-top: 20px;
  }
  .app-card {
    background: rgba(15,20,35,0.8); border-radius: 14px;
    overflow: hidden; border: 1px solid rgba(74,158,255,0.2);
  }
  .app-card:hover { transform: translateY(-5px); border-color: rgba(74,158,255,0.6); }
  .app-card img.cover { width: 100%; height: 160px; object-fit: cover; background: #0a0e1a; }
  .app-info { padding: 15px; }
  .app-info h3 { margin-bottom: 8px; color: #6bb6ff; font-size: 17px; }
  .app-info p { margin: 5px 0; font-size: 13px; color: #a8b8d0; }
  .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; margin-top: 8px; }
  .badge.android { background: #3ddc84; color: #000; }
  .badge.pc { background: #4a9eff; color: #fff; }
  .warning-box { background: rgba(255,179,71,0.1); border: 1px solid #ffb347; color: #ffd699; padding: 15px; border-radius: 10px; margin: 15px 0; font-size: 14px; line-height: 1.7; }
  .info-box { background: rgba(74,144,226,0.1); border: 1px solid #4a90e2; color: #a8d0ff; padding: 14px; border-radius: 10px; margin: 10px 0; font-size: 13px; line-height: 1.7; }
  .hint { font-size: 12px; color: #f59e0b; margin-top: 6px; }
  .hero { text-align: center; padding: 30px 20px; }
  .hero-logo {
    font-size: 80px;
    background: linear-gradient(135deg, #4a9eff, #6bb6ff, #4a9eff);
    background-size: 200% 200%;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    animation: shine 3s ease-in-out infinite; line-height: 1;
    font-family: 'Arial Black', sans-serif; margin-bottom: 15px;
  }
  @keyframes shine { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
  .hero h1 { font-size: 34px; background: linear-gradient(135deg, #fff, #6bb6ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
  .hero p { color: #8fa8c8; font-size: 15px; margin-bottom: 25px; }
  footer { text-align: center; padding: 30px 20px; color: #5a7090; font-size: 13px; }
  footer b { background: linear-gradient(135deg, #4a9eff, #6bb6ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .big-buttons { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; margin-top: 25px; }
  .big-btn { padding: 20px 40px; font-size: 18px; border-radius: 15px; min-width: 220px; }
  @media (max-width: 600px) {
    header h1 { font-size: 16px; }
    .hero-logo { font-size: 60px; }
    .hero h1 { font-size: 24px; }
    .big-btn { padding: 16px 25px; font-size: 16px; min-width: 180px; }
  }
</style>
</head>
<body>

<header>
  <h1>🛒 بازار Adrian</h1>
  <nav>
    <a onclick="showPage('home')">خانه</a>
    <a onclick="showPage('browse')">بازی‌ها</a>
    <a onclick="showPage('upload')">آپلود</a>
  </nav>
</header>

<div class="container" id="content"></div>

<footer>
  <p>ساخته شده توسط <b>Adrian</b> با ❤️</p>
</footer>

<script>
// ============================================
// 🔴 تنظیمات GitHub (توکن اینجا نیست!)
// ============================================
let GITHUB = {
  username: "maryamvp200",
  repo: "market-data",
  token: "",
  file: "market-data.json"
};

// توکن رو از localStorage بخون
try {
  const savedToken = localStorage.getItem("adrian_github_token");
  if (savedToken) GITHUB.token = savedToken;
} catch (e) {}

const UPLOAD_PASSWORD = "835556";

let DATA = { apps: [], files: {}, uploadUnlocked: false };
let _githubSha = null;

async function loadData() {
  if (GITHUB.username && GITHUB.repo) {
    try {
      const url = `https://api.github.com/repos/${GITHUB.username}/${GITHUB.repo}/contents/${GITHUB.file}?t=${Date.now()}`;
      const headers = { "Accept": "application/vnd.github.v3+json" };
      if (GITHUB.token) headers["Authorization"] = `token ${GITHUB.token}`;
      const resp = await fetch(url, { headers });
      if (resp.ok) {
        const json = await resp.json();
        _githubSha = json.sha;
        const parsed = JSON.parse(decodeBase64Utf8(json.content));
        DATA.apps = parsed.apps || [];
        DATA.files = parsed.files || {};
        console.log("✅ لود شد");
        return;
      } else if (resp.status === 404) {
        console.log("ℹ️ بار اول");
        return;
      }
    } catch (e) { console.log("⚠️", e); }
  }
  try {
    const saved = localStorage.getItem("adrian_market");
    if (saved) {
      const parsed = JSON.parse(saved);
      DATA.apps = parsed.apps || [];
      DATA.files = parsed.files || {};
    }
  } catch (e) {}
}

async function saveData() {
  try {
    localStorage.setItem("adrian_market", JSON.stringify({
      apps: DATA.apps, files: DATA.files
    }));
  } catch (e) {}

  if (GITHUB.username && GITHUB.repo && GITHUB.token) {
    try {
      const url = `https://api.github.com/repos/${GITHUB.username}/${GITHUB.repo}/contents/${GITHUB.file}`;
      const headers = {
        "Authorization": `token ${GITHUB.token}`,
        "Accept": "application/vnd.github.v3+json",
        "Content-Type": "application/json"
      };
      try {
        const getResp = await fetch(`${url}?t=${Date.now()}`, { headers });
        if (getResp.ok) { const j = await getResp.json(); _githubSha = j.sha; }
      } catch (e) {}
      const payload = { apps: DATA.apps, files: DATA.files };
      const content = encodeBase64Utf8(JSON.stringify(payload));
      const body = { message: `آپدیت`, content: content };
      if (_githubSha) body.sha = _githubSha;
      const resp = await fetch(url, { method: "PUT", headers, body: JSON.stringify(body) });
      if (resp.ok) {
        const r = await resp.json();
        _githubSha = r.content.sha;
        return true;
      }
      return false;
    } catch (e) { return false; }
  }
  return true;
}

function encodeBase64Utf8(str) { return btoa(unescape(encodeURIComponent(str))); }
function decodeBase64Utf8(b64) { return decodeURIComponent(escape(atob(b64.replace(/\s/g, "")))); }

function flash(msg, type = "info", dur = 4000) {
  const content = document.getElementById("content");
  if (!content) return;
  const div = document.createElement("div");
  div.className = `flash ${type}`;
  div.textContent = msg;
  content.insertBefore(div, content.firstChild);
  setTimeout(() => div.remove(), dur);
}

function showPage(page) {
  const content = document.getElementById("content");
  content.innerHTML = "";
  switch(page) {
    case "home": renderHome(); break;
    case "browse": renderBrowse(); break;
    case "upload": renderUploadGate(); break;
    default: renderHome();
  }
  window.scrollTo(0, 0);
}

function renderHome() {
  document.getElementById("content").innerHTML = `
    <div class="card hero">
      <div class="hero-logo">🛒</div>
      <h1>بازار Adrian</h1>
      <p>اینجا می‌تونی بازی‌های ساخته شده رو نصب کنی</p>
      <div class="big-buttons">
        <button class="big-btn" onclick="showPage('browse')">🎮 دیدن بازی‌ها</button>
      </div>
    </div>
    <div class="info-box" style="text-align:center;">
      📦 تعداد بازی‌های موجود: <b>${DATA.apps.length}</b>
    </div>
    <div class="card" style="text-align:center;">
      <p style="color:#8fa8c8;margin-bottom:10px;font-size:13px;">⚙️ تنظیمات ادمین (فقط خودت می‌بینی)</p>
      <button onclick="setToken()" class="btn-small">🔑 ${GITHUB.token ? "تغییر توکن" : "وارد کردن توکن"}</button>
    </div>
  `;
}

function setToken() {
  const newToken = prompt(
    "توکن GitHub رو وارد کن:\\n(از github.com/settings/tokens بساز)",
    GITHUB.token ? "***" + GITHUB.token.slice(-4) : ""
  );
  if (newToken && !newToken.startsWith("***")) {
    GITHUB.token = newToken.trim();
    localStorage.setItem("adrian_github_token", GITHUB.token);
    flash("توکن ذخیره شد ✅", "success");
    loadData().then(() => {
      if (DATA.apps.length > 0) flash(`✅ ${DATA.apps.length} بازی لود شد`, "success");
      showPage("home");
    });
  }
}

function renderBrowse() {
  const content = document.getElementById("content");
  const apps = [...DATA.apps].reverse();

  if (!apps.length) {
    content.innerHTML = `
      <div class="card">
        <h2>🎮 بازی‌ها</h2>
        <p style="color:#8fa8c8;">هنوز هیچ بازی‌ای آپلود نشده!</p>
      </div>
    `;
    return;
  }

  content.innerHTML = `
    <div class="card">
      <h2>🎮 بازی‌ها (${apps.length})</h2>
      <div class="apps-grid">${apps.map(appCardHTML).join("")}</div>
    </div>
  `;
}

function appCardHTML(a) {
  const badge = a.platform === "android"
    ? '<span class="badge android">📱 اندروید</span>'
    : '<span class="badge pc">💻 کامپیوتر</span>';
  const iconSrc = DATA.files[a.icon] || "";

  return `
    <div class="app-card">
      <img class="cover" src="${iconSrc}" alt="">
      <div class="app-info">
        <h3>${escapeHtml(a.name)}</h3>
        <p>${escapeHtml(a.description || "بدون توضیح")}</p>
        ${badge}
        <br>
        <button class="btn btn-small" onclick="downloadApp('${a.id}')">⬇️ دانلود</button>
      </div>
    </div>
  `;
}

function renderUploadGate() {
  const content = document.getElementById("content");
  if (DATA.uploadUnlocked) { renderUploadForm(); return; }
  content.innerHTML = `
    <div class="card" style="max-width:450px;margin:auto;text-align:center;">
      <div style="font-size:60px;margin-bottom:15px;">🔐</div>
      <h2>ورود ادمین</h2>
      <p style="color:#8fa8c8;margin-bottom:20px;">رمز آپلود رو وارد کن</p>
      <input id="gatePassword" type="password" placeholder="رمز..."
             style="text-align:center;font-size:18px;letter-spacing:4px;"
             onkeypress="if(event.key==='Enter')checkPassword()">
      <button onclick="checkPassword()" style="width:100%;">🔓 ورود</button>
    </div>
  `;
}

function checkPassword() {
  const input = document.getElementById("gatePassword");
  if (!input) return;
  if (input.value.trim() === UPLOAD_PASSWORD) {
    DATA.uploadUnlocked = true;
    flash("خوش اومدی Adrian 👑", "success");
    setTimeout(() => renderUploadForm(), 500);
  } else {
    flash("رمز اشتباهه!", "error");
    input.value = "";
    input.focus();
  }
}

function renderUploadForm() {
  document.getElementById("content").innerHTML = `
    <div class="card">
      <h2>📤 آپلود بازی جدید</h2>
      <div class="warning-box">⚠️ من کد خرابی نمی‌ذارم. من فقط به کمک به مردم این رو ساختم.</div>

      <label>اسم بازی *</label>
      <input id="upName" placeholder="مثلاً: بازی مار">

      <label>عکس بازی *</label>
      <input id="upIcon" type="file" accept="image/*">

      <label>توضیح (اختیاری)</label>
      <textarea id="upDesc" rows="3"></textarea>

      <label>فایل بازی *</label>
      <input id="upFile" type="file">
      <p class="hint">💻 .py, .pyw, .cpp, .c, .exe | 📱 .apk</p>

      <label>پلتفرم *</label>
      <select id="upPlatform">
        <option value="">انتخاب کن...</option>
        <option value="pc">💻 کامپیوتر</option>
        <option value="android">📱 اندروید</option>
      </select>

      <button onclick="doUpload()" style="width:100%;">🚀 آپلود</button>
    </div>
  `;
}

async function doUpload() {
  if (!GITHUB.token) {
    flash("اول توکن رو تنظیم کن (توی صفحه خانه)", "error");
    return;
  }

  const name = document.getElementById("upName").value.trim();
  const desc = document.getElementById("upDesc").value.trim();
  const platform = document.getElementById("upPlatform").value;
  const iconFile = document.getElementById("upIcon").files[0];
  const appFile = document.getElementById("upFile").files[0];

  if (!name || !platform || !iconFile || !appFile) {
    flash("فیلدهای اجباری رو پر کن", "error"); return;
  }

  const ext = appFile.name.split(".").pop().toLowerCase();

  if (platform === "pc" && !["py","pyw","cpp","c","h","hpp","exe"].includes(ext)) {
    flash("برای کامپیوتر فقط فایل کد یا exe", "error"); return;
  }
  if (platform === "android" && ext !== "apk") {
    flash("برای اندروید فقط APK", "error"); return;
  }

  if (appFile.size > 5 * 1024 * 1024) {
    flash("فایل بیشتر از ۵ مگابایته!", "error"); return;
  }

  if (!confirm("من کد خرابی نمی‌ذارم.\nمن فقط به کمک به مردم این رو ساختم.\n\nموافقی؟")) return;

  flash("در حال آپلود... صبر کن", "info", 15000);

  try {
    const iconData = await fileToBase64(iconFile);
    const fileData = await fileToBase64(appFile);

    const appId = "a_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
    const iconKey = "icon_" + appId;
    const fileKey = "file_" + appId;

    DATA.files[iconKey] = iconData;
    DATA.files[fileKey] = fileData;

    DATA.apps.push({
      id: appId, name: name, description: desc, platform: platform,
      icon: iconKey, file: fileKey, fileName: appFile.name, fileExt: ext,
      created: new Date().toISOString()
    });

    const ok = await saveData();
    if (ok) {
      flash("بازی آپلود شد 🎉", "success");
      setTimeout(() => showPage("browse"), 900);
    } else {
      flash("آپلود ناموفق! اول توکن رو تنظیم کن", "error");
    }
  } catch (e) {
    console.log(e);
    flash("خطا در آپلود", "error");
  }
}

function downloadApp(appId) {
  const a = DATA.apps.find(x => x.id === appId);
  if (!a) { flash("پیدا نشد", "error"); return; }
  const fileData = DATA.files[a.file];
  if (!fileData) { flash("فایل نیست", "error"); return; }
  const link = document.createElement("a");
  link.href = fileData;
  link.download = a.fileName || a.name;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  flash("دانلود شروع شد ✅", "success");
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

(async function init() {
  await loadData();
  showPage("home");
})();
</script>

</body>
</html>
